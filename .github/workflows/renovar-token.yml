name: Renovar token do Instagram

# O token atual (system-user) não expira, então este workflow só roda manualmente.
# Só use se um dia trocar por um token de 60 dias (precisa do secret GH_PAT).
on:
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renovar e salvar no secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NOVO=$(python scripts/refresh_token.py)
          echo "::add-mask::$NOVO"
          gh secret set IG_ACCESS_TOKEN --body "$NOVO" --repo "$GITHUB_REPOSITORY"
          echo "Token renovado."
